[package]
name = "gpui-editor"
version = "0.0.0"
edition = "2024"
description = "A local Markdown editor for macOS"
readme = "README.md"
repository = "https://github.com/narumiruna/gpui-editor"
license = "MIT"
publish = true

[dependencies]
mathra = { version = "1.12.0", default-features = false }
mmdflux = { version = "2.6.1", default-features = false }
pulldown-cmark = { version = "0.13.6", default-features = false }
resvg = { version = "0.45.1", default-features = false, features = ["text", "system-fonts"] }
roxmltree = "0.20.0"
serde_yaml_ng = "0.10.0"
tempfile = "3.27.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
gpui = { version = "0.2.2", default-features = false, features = ["runtime_shaders"] }
image = { version = "0.25.8", default-features = false }
objc2 = "0.6.5"
unicode-segmentation = "1.12.0"
ureq = { version = "3.3.0", default-features = false, features = ["rustls"] }
url = "2.5.9"

[target.'cfg(target_os = "macos")'.dev-dependencies]
gpui = { version = "0.2.2", default-features = false, features = ["test-support"] }
