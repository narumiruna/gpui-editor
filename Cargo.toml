[workspace]
members = [
    "crates/app",
    "crates/codemirror",
    "crates/document",
    "crates/preview",
    "crates/workspace",
]
resolver = "3"

[workspace.package]
edition = "2024"
repository = "https://github.com/narumiruna/gpui-editor"
license = "MIT"
publish = false

[workspace.dependencies]
gpui = { version = "0.2.2", default-features = false, features = ["font-kit", "runtime_shaders"] }
image = { version = "0.25.8", default-features = false }
resvg = { version = "0.45.1", default-features = false }
tempfile = "3.27.0"
