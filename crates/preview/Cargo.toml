[package]
name = "gpui-editor-preview"
version = "0.0.0"
edition.workspace = true
description = "Math, diagrams, and image previews for GPUI Editor"
repository.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
mathra = { version = "1.12.0", default-features = false }
mmdflux = { version = "2.6.1", default-features = false }
resvg = { workspace = true, features = ["text", "system-fonts"] }
roxmltree = "0.20.0"

[target.'cfg(target_os = "macos")'.dependencies]
image = { workspace = true, features = ["gif", "jpeg", "png", "webp"] }
ureq = { version = "3.3.0", default-features = false, features = ["rustls"] }
url = "2.5.9"

[target.'cfg(target_os = "macos")'.dev-dependencies]
tempfile.workspace = true
