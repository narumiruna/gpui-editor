[package]
name = "gpui-editor"
version = "0.2.0"
edition.workspace = true
description = "A local Markdown editor for macOS"
readme = "../../README.md"
repository.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
gpui-editor-document = { path = "../document" }
gpui-editor-preview = { path = "../preview" }
gpui-editor-workspace = { path = "../workspace" }

[target.'cfg(target_os = "macos")'.dependencies]
base64 = "0.23"
gpui-editor-codemirror = { path = "../codemirror" }
gpui.workspace = true
image = { workspace = true, features = ["jpeg", "png", "tiff"] }
libc = "0.2"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSAccessibilityConstants", "NSApplication", "NSAttributedString", "NSColor", "NSFont", "NSGraphicsContext", "NSLayoutManager", "NSParagraphStyle", "NSResponder", "NSText", "NSTextContainer", "NSTextStorage", "objc2-core-foundation", "objc2-core-graphics"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGBitmapContext", "CGColorSpace", "CGContext", "CGImage"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSValue"] }
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10.0"
tempfile.workspace = true
unicode-segmentation = "1.12.0"

[target.'cfg(target_os = "macos")'.dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
resvg.workspace = true
