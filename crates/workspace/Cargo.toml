[package]
name = "gpui-editor-workspace"
version = "0.0.0"
edition.workspace = true
description = "Local file handling for GPUI Editor"
repository.workspace = true
license.workspace = true
publish.workspace = true

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
libc = "0.2"
tempfile.workspace = true

[target.'cfg(windows)'.dependencies]
tempfile.workspace = true
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Authorization", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile.workspace = true
