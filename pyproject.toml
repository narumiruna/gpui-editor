[project]
name = "gpui-editor"
description = "A local Markdown editor for macOS and Windows"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = []
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/narumiruna/gpui-editor"

[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[tool.maturin]
bindings = "bin"
manifest-path = "crates/app/Cargo.toml"
strip = true
include = ["docs/licenses/stix-two-math.txt"]

[tool.uv]
cache-keys = [
  { file = "pyproject.toml" },
  { file = "Cargo.toml" },
  { file = "Cargo.lock" },
  { file = "crates/*/Cargo.toml" },
  { file = "crates/*/src/**/*.rs" },
]
